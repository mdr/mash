<!doctype html>
<meta charset="utf-8">
<title>Mash recursion depth</title>
<!-- Used by browser.mjs: runs Mash code in a fresh worker, as the shell does. The wasm is compiled once, here. -->
<script type="module">
  const TIMEOUT_MS = 30000;
  const module = await WebAssembly.compileStreaming(fetch('../pkg/mash_web_bg.wasm'));

  window.runInWorker = (source, probe) =>
    new Promise((resolve) => {
      const worker = new Worker(new URL('./depth-worker.js', import.meta.url), { type: 'module' });
      const finish = (result) => {
        clearTimeout(timer);
        worker.terminate();
        resolve(result);
      };
      const timer = setTimeout(() => finish({ timeout: true }), TIMEOUT_MS);
      worker.onmessage = ({ data }) => finish(data);
      worker.onerror = (event) => finish({ failed: `worker failed: ${event.message}` });
      worker.postMessage({ module, source, probe });
    });
  window.ready = true;
</script>
