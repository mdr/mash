[package]
name = "mash-web"
description = "Mash in the browser: wasm-bindgen glue, an in-memory platform, and a host for xterm.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for the browser; rlib so that the platform, host and key translation can be tested natively
crate-type = ["cdylib", "rlib"]

[dependencies]
mash-core.workspace = true
mash-repl.workspace = true
jiff.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Must match the wasm-bindgen CLI in the Nix flake exactly
wasm-bindgen = "=0.2.126"
js-sys = "0.3"

[lints]
workspace = true
