[workspace]
resolver = "3"
members = ["crates/*"]
# Local design spikes have their own workspace and are not part of the build.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
mash-syntax = { path = "crates/mash-syntax" }
mash-core = { path = "crates/mash-core" }
mash-os = { path = "crates/mash-os" }
mash-repl = { path = "crates/mash-repl" }
mash-macros = { path = "crates/mash-macros" }
rowan = "0.16"
indexmap = "2.14"
jiff = "0.2.38"
fancy-regex = "0.19"
parse_datetime = "0.16"
base64 = "0.22"
quick-xml = "0.37"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
unicode-width = "0.2"
unicode-segmentation = "1.12"
crossterm = "0.29"
signal-hook = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
